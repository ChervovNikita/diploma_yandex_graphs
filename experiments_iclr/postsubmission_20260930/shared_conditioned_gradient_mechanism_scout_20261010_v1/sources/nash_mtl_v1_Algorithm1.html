<figure id="alg1" class="ltx_float ltx_float_algorithm ltx_framed ltx_framed_top">
<figcaption class="ltx_caption"><span class="ltx_tag ltx_tag_float"><span id="alg1.3" class="ltx_text ltx_font_bold">Algorithm 1</span> </span> Nash-MTL</figcaption>
<div id="alg1.4" class="ltx_listing ltx_framed ltx_framed_topbottom ltx_listing">
<div id="alg1.l1" class="ltx_listingline">
              
              
             <span id="alg1.l1.2" class="ltx_text ltx_font_bold">Input:</span> <math id="alg1.l1.m1" class="ltx_Math" alttext="\theta^{(0)}" display="inline" intent=":literal"><semantics><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow></msup><annotation encoding="application/x-tex">\theta^{(0)}</annotation></semantics></math> – initial parameter vector, <math id="alg1.l1.m2" class="ltx_Math" alttext="\{\ell_{i}\}_{i=1}^{K}" display="inline" intent=":literal"><semantics><msubsup><mrow><mo stretchy="false">{</mo><msub><mi mathvariant="normal">ℓ</mi><mi>i</mi></msub><mo stretchy="false">}</mo></mrow><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>K</mi></msubsup><annotation encoding="application/x-tex">\{\ell_{i}\}_{i=1}^{K}</annotation></semantics></math> – differentiable loss functions, <math id="alg1.l1.m3" class="ltx_Math" alttext="\eta" display="inline" intent=":literal"><semantics><mi>η</mi><annotation encoding="application/x-tex">\eta</annotation></semantics></math> – learning rate

</div>
<div id="alg1.l2" class="ltx_listingline">
              
              
             <span id="alg1.l2.2" class="ltx_text ltx_font_bold">for</span> <math id="alg1.l2.m1" class="ltx_Math" alttext="t=1,...,T" display="inline" intent=":literal"><semantics><mrow><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><mo>,</mo><mi mathvariant="normal">…</mi><mo>,</mo><mi>T</mi></mrow><annotation encoding="application/x-tex">t=1,...,T</annotation></semantics></math> <span id="alg1.l2.3" class="ltx_text ltx_font_bold">do</span>



</div>
<div id="alg1.l3" class="ltx_listingline">
              
              
              Compute task gradients <math id="alg1.l3.m1" class="ltx_Math" alttext="g^{(t)}_{i}=\nabla_{\theta^{(t-1)}}\ell_{i}" display="inline" intent=":literal"><semantics><mrow><msubsup><mi>g</mi><mi>i</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msubsup><mo>=</mo><mrow><msub><mo rspace="0.167em">∇</mo><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow><mo stretchy="false">)</mo></mrow></msup></msub><msub><mi mathvariant="normal">ℓ</mi><mi>i</mi></msub></mrow></mrow><annotation encoding="application/x-tex">g^{(t)}_{i}=\nabla_{\theta^{(t-1)}}\ell_{i}</annotation></semantics></math>

</div>
<div id="alg1.l4" class="ltx_listingline">
              
              
              Set <math id="alg1.l4.m1" class="ltx_Math" alttext="G^{(t)}" display="inline" intent=":literal"><semantics><msup><mi>G</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><annotation encoding="application/x-tex">G^{(t)}</annotation></semantics></math> the matrix with columns <math id="alg1.l4.m2" class="ltx_Math" alttext="g^{(t)}_{i}" display="inline" intent=":literal"><semantics><msubsup><mi>g</mi><mi>i</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msubsup><annotation encoding="application/x-tex">g^{(t)}_{i}</annotation></semantics></math>

</div>
<div id="alg1.l5" class="ltx_listingline">
              
              
              Solve for <math id="alg1.l5.m1" class="ltx_Math" alttext="\alpha" display="inline" intent=":literal"><semantics><mi>α</mi><annotation encoding="application/x-tex">\alpha</annotation></semantics></math>: <math id="alg1.l5.m2" class="ltx_Math" alttext="(G^{(t)})^{\top}G^{(t)}\alpha=1/\alpha" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mrow><mo stretchy="false">(</mo><msup><mi>G</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><mo stretchy="false">)</mo></mrow><mo>⊤</mo></msup><mo lspace="0em" rspace="0em">​</mo><msup><mi>G</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><mo lspace="0em" rspace="0em">​</mo><mi>α</mi></mrow><mo>=</mo><mrow><mn>1</mn><mo>/</mo><mi>α</mi></mrow></mrow><annotation encoding="application/x-tex">(G^{(t)})^{\top}G^{(t)}\alpha=1/\alpha</annotation></semantics></math> to obtain <math id="alg1.l5.m3" class="ltx_Math" alttext="\alpha^{(t)}" display="inline" intent=":literal"><semantics><msup><mi>α</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><annotation encoding="application/x-tex">\alpha^{(t)}</annotation></semantics></math>

</div>
<div id="alg1.l6" class="ltx_listingline">
              
              
              Update the parameters <math id="alg1.l6.m1" class="ltx_Math" alttext="\theta^{(t)}=\theta^{(t)}-\eta G^{(t)}\alpha^{(t)}" display="inline" intent=":literal"><semantics><mrow><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mrow><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><mo>−</mo><mrow><mi>η</mi><mo lspace="0em" rspace="0em">​</mo><msup><mi>G</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><mo lspace="0em" rspace="0em">​</mo><msup><mi>α</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup></mrow></mrow></mrow><annotation encoding="application/x-tex">\theta^{(t)}=\theta^{(t)}-\eta G^{(t)}\alpha^{(t)}</annotation></semantics></math>

</div>
<div id="alg1.l7" class="ltx_listingline">
              
              
             <span id="alg1.l7.2" class="ltx_text ltx_font_bold">end</span> <span id="alg1.l7.3" class="ltx_text ltx_font_bold">for</span>
</div>
<div id="alg1.l8" class="ltx_listingline">
              
              
             <span id="alg1.l8.2" class="ltx_text ltx_font_bold">Return:</span> <math id="alg1.l8.m1" class="ltx_Math" alttext="\theta^{(T)}" display="inline" intent=":literal"><semantics><msup><mi>θ</mi><mrow><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow></msup><annotation encoding="application/x-tex">\theta^{(T)}</annotation></semantics></math>

</div>
</div>
</figure>
