[project]
name = "nikita-neurips-gnnm"
version = "0.1.0"
description = "GNNM ablation studies on Platonov heterophilous benchmarks."
requires-python = "==3.11.*"

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.2",
    "tqdm==4.67.1",
    "pyyaml==6.0.2",
    "torch==2.1.2+cu118",
    "torchvision==0.16.2+cu118",
    "torchaudio==2.1.2+cu118",
    "torch-geometric==2.7.0",
    "dgl==2.4.0+cu118",
]

[tool.uv.sources]
torch       = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio  = { index = "pytorch-cu118" }
dgl         = { url = "https://data.dgl.ai/wheels/torch-2.1/cu118/dgl-2.4.0%2Bcu118-cp311-cp311-manylinux1_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
